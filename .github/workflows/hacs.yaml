name: Validate with HACS

# No schedule trigger on purpose: GitHub disables scheduled workflows after
# 60 days without activity in the repository, and a disabled workflow silently
# skips every push until someone re-enables it by hand.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v5"
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # This integration is distributed as a custom repository, so it is
          # not part of the Home Assistant brands repository.
          ignore: "brands"
